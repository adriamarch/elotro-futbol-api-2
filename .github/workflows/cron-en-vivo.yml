name: cron-en-vivo

# API SECUNDARIA DESACTIVADA (oct-2026): el cron programado está apagado
# (Railway ya no se usa). Para reactivarlo, descomenta el bloque "schedule".
on:
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch: {}  # permite ejecutarlo manualmente desde GitHub para probar

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4  # menor que la frecuencia (5 min) para evitar solapes
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar cron de respaldo
        run: npm run cron:respaldo
        env:
          CRON_RESPALDO_URL: ${{ secrets.CRON_RESPALDO_URL }}
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
